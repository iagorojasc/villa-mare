name: Publicar web

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # actualiza la disponibilidad cada 3 horas
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar disponibilidad desde el calendario iCal
        env:
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
        run: |
          if [ -n "$ICAL_URLS" ]; then
            python3 tools/sync_availability.py || echo "::warning::No se pudo actualizar la disponibilidad; se usa la última guardada"
          fi
      - name: Guardar la disponibilidad en el repositorio (para Netlify)
        run: |
          if ! git diff --quiet -- site/data/availability.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/availability.json
            git commit -m "Disponibilidad actualizada"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
